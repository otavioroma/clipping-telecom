name: Testar Acesso Portal Exibidor

on:
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub
  schedule:
    - cron: '0 12 * * *' # Roda automaticamente todo dia às 12:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4

      - name: Executar script de teste
        run: python teste.code.py # Substitua pelo nome real do seu arquivo .py
