name: Teste de Agendamento

on:
  schedule:
    # Agendado para rodar a cada 5 minutos (o intervalo mínimo do GitHub)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite que você force uma execução manual agora

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar Horario
        run: |
          echo "O workflow foi disparado com sucesso!"
          echo "Horario atual UTC: $(date)"
